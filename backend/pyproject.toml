[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodon-backend"
version = "1.0.0"
description = "Megalodon Core API, Gateway & Traffic Management Platform"
authors = [{ name = "Megalodon Team", email = "security@megalodon.local" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pyjwt[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
    "psutil>=5.9.8",
    "prometheus-client>=0.20.0",
    "aiokafka>=0.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "B008", "F841"]
