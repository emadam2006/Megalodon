[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodon-agent"
version = "1.0.0"
description = "Megalodon Linux Host Network Discovery Agent"
authors = [{ name = "Megalodon Team", email = "security@megalodon.local" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
megalodon-agent = "megalodon_agent.main:main"
sentinel-agent = "megalodon_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["megalodon_agent*", "sentinel_agent*"]
