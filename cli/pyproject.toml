[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodon-cli"
version = "1.0.0"
description = "Megalodon Command Line Interface"
authors = [{ name = "Megalodon Team", email = "security@megalodon.local" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
megalodon = "megalodon_cli.main:app"
sentinel = "megalodon_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["megalodon_cli*", "sentinel_cli*"]
