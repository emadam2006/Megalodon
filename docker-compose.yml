services:
  # ============================================================================
  # Infrastructure Data Layer
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: megalodon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megalodon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-megalodon_production_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-megalodon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megalodon || pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: megalodon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka (KRaft mode - no Zookeeper required)
  kafka:
    image: apache/kafka:latest
    container_name: megalodon-kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Megalodon Core Services
  # ============================================================================
  megalodon-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: megalodon-api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-megalodon}:${POSTGRES_PASSWORD:-megalodon_production_password_replace_me}@postgres:5432/${POSTGRES_DB:-megalodon}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Megalodon Linux Host Network Discovery Agent
  megalodon-network-agent:
    build:
      context: ./network-agent
      dockerfile: Dockerfile
    container_name: megalodon-network-agent
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MEGALODON_API_URL=http://127.0.0.1:8000/api/v1/network/discovery
      - SENTINEL_API_URL=http://127.0.0.1:8000/api/v1/network/discovery
      - NETWORK_DISCOVERY_INTERVAL=10
      - NETWORK_AGENT_TOKEN=${NETWORK_AGENT_TOKEN:-megalodon_agent_secret_auth_token_for_internal_comms}
    depends_on:
      megalodon-api:
        condition: service_started

  # ============================================================================
  # Megalodon Asynchronous Kafka Workers
  # ============================================================================
  megalodon-analytics-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: megalodon-analytics-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner", "analytics"]
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy

  megalodon-security-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: megalodon-security-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner", "security"]
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy

  megalodon-alert-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: megalodon-alert-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner", "alert"]
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy

  # ============================================================================
  # Frontend Web UI
  # ============================================================================
  megalodon-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: megalodon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - megalodon-api

volumes:
  postgres_data:
  redis_data:
  kafka_data:
